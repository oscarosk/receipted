services:
  - type: web
    name: receipted
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_LOGIN_SCOPES
        value: openid email
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RECEIPTED_SIGNING_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JUDGE_BUYER_EMAIL
        sync: false
      - key: JUDGE_BUYER_PASSWORD
        sync: false
